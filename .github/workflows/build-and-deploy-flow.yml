name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      apiBaseUrl:
        description: Public Test API base URL, including /api/.
        required: true
        type: string
    secrets:
      storageConnectionString:
        description: Frontend Storage connection string; needed only for deployment.
        # PR validation can build without Azure credentials.
        required: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ inputs.apiBaseUrl }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build (into ./dist)
        run: npm run build

      - name: Deploy to Azure Storage static website
        # github refers to the caller's event and ref in a reusable workflow.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.storageConnectionString }}
        with:
          inlineScript: |
            : "${VITE_API_BASE_URL:?Pass a non-empty apiBaseUrl input for deployment.}"
            : "${AZURE_STORAGE_CONNECTION_STRING:?Pass the storageConnectionString secret for deployment.}"

            az storage blob upload-batch \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --destination '$web' \
              --source dist \
              --overwrite true
