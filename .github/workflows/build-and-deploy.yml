name: Build and Deploy to Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    name: Build and deploy to Test
    uses: ./.github/workflows/build-and-deploy-flow.yml
    with:
      # Public Test API base URL, including /api/; Vite embeds it at build time.
      apiBaseUrl: ${{ vars.VITE_API_BASE_URL }}
    secrets:
      storageConnectionString: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
